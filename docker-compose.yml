services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: armingrobbelaar/investment_app:latest
    container_name: investment_app
    restart: unless-stopped
    ports:
      - "3037:3037"
      - "3337:3337"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - tensorflow-api
    environment:
      POSTGRES_HOST: host.docker.internal
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: changeme
      INVESTMENTS_DB: investments_app
      TENSORFLOW_API_URL: http://tensorflow-api:8000
      TENSORFLOW_SERVER_URL: http://localhost:8868
      NODE_ENV: production
      PORT: 3037
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3037}
      GITHUB_ID: ${GITHUB_ID:-}
      GITHUB_SECRET: ${GITHUB_SECRET:-}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  tensorflow-api:
    build:
      context: ./tensorflow_service
    image: armingrobbelaar/investment_tensorflow_api:latest
    container_name: tensorflow_api
    restart: unless-stopped
    ports:
      - "8869:8000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
