services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: armingrobbelaar/investment_app:latest
    container_name: investment_app
    restart: unless-stopped
    # Use host networking to easily access existing DBs on 5432/5433
    network_mode: host
    environment:
      # Point to your existing databases on the host
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: changeme
      INVESTMENTS_DB: Investments
      USERS_DB: Users
      # Frontend environment
      NODE_ENV: production
      PORT: 3000
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
